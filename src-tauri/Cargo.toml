[package]
name = "debtshark"
version = "0.2.1"
description = "DebtShark: Consumer Credit Shield & Debt Collector Dispute Console"
authors = ["Bored Polymath Studios"]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/boredpolymath/debtshark"

[lib]
name = "debtshark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid"] }
sha2 = "0.10"
thiserror = "2.0"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.1", features = ["derive"] }
rand = "0.10.3"
ed25519-dalek = { version = "3.0", default-features = false, features = ["std", "rand_core"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
